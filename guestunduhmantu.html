<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>📋 Daftar Tamu Unduh Mantu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f7f9fb;
      padding: 2rem;
      margin: 0;
      color: #333;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    input, button, textarea {
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background-color: #993333;
      color: white;
    }

    button {
      background: #25D366;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      margin-top: 0.3rem;
      cursor: pointer;
    }

    button:hover {
      background: #1ebe5d;
    }

    .url {
      font-size: 0.85rem;
      color: #555;
      word-break: break-word;
    }

    form {
      margin-top: 2rem;
      padding: 1rem;
      background: #fff;
      border-radius: 8px;
      max-width: 500px;
      margin-inline: auto;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    form input, form button {
      display: block;
      width: 100%;
      margin-bottom: 1rem;
    }

    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      td:before {
        content: attr(data-label);
        font-weight: bold;
        display: block;
        margin-bottom: 0.5rem;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h2>📋 Daftar Tamu Unduh Mantu</h2>

    <form id="addGuestForm">
    <h3>➕ Tambah Tamu Baru</h3>
    <input type="text" id="newName" placeholder="Nama lengkap" required />
    <input type="text" id="newAsal" placeholder="Asal (opsional)" />
    <button type="submit">Tambah ke Daftar</button>
    <p id="submitStatus"></p>
  </form>

  <div style="max-width: 500px; margin: 0 auto 1rem;">
    <input type="text" id="searchInput" placeholder="🔍 Cari nama tamu..." />
  </div>

  <div id="tableContainer">Loading...</div>

  <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/1D0KY0MwZQk2jk9J8VFUvrvYHLpEkuLYG7uyD2J3PF2Q/gviz/tq?sheet=Sheet1&tq=' + encodeURIComponent('SELECT B, C');
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbwedc2XXk0qWnt6PLmNy_JkY6fdZ_PJo-hnm_zi8ED-M8bxbe9GX-p34JYhn4bQHPhC/exec';

    let allRows = [];

    function createWhatsAppLink(name) {
      const link = `https://gasnikahkuy.github.io/unduhmantu/?to=${encodeURIComponent(name)}`;
      const message = `Dhumateng Bapak/Ibu/Saudara/i
${name}

Kanthi bingah rahayu, kulo nyuwun rawuhipun panjenengan ing acara Ngunduh Mantu keluarga kulo.

Informasi lengkap saged kapanggih wonten ing link ing ngandhap menika:

${link}

Matur nuwun sanget atas donga lan pangestunipun.

🙏 Bella & Kris`;
      return `https://wa.me/?text=${encodeURIComponent(message)}`;
    }

    function renderTable(rows) {
      const container = document.getElementById('tableContainer');
      if (!rows.length) {
        container.innerHTML = '<p>Tidak ada data yang cocok.</p>';
        return;
      }

      let html = '<table><thead><tr><th>Nama</th><th>Asal</th><th>WhatsApp</th></tr></thead><tbody>';
      rows.forEach(row => {
        const name = row[0] || '';
        const asal = row[1] || '';
        const waLink = createWhatsAppLink(name);
        const link = `https://gasnikahkuy.github.io/unduhmantu/?to=${encodeURIComponent(name)}`;

        html += `<tr>
          <td data-label="Nama">${name}</td>
          <td data-label="Asal">${asal}</td>
          <td data-label="WhatsApp">
            <a href="${waLink}" target="_blank"><button>Kirim WA</button></a>
            <div class="url">${link}</div>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function fetchData() {
      fetch(sheetUrl)
        .then(res => res.text())
        .then(rep => {
          const json = JSON.parse(rep.substr(47).slice(0, -2));
          allRows = json.table.rows.map(r => [
            r.c[0]?.v || '',
            r.c[1]?.v || ''
          ]);
          renderTable(allRows);
        })
        .catch(err => {
          console.error('Gagal memuat data', err);
          document.getElementById('tableContainer').innerHTML = '<p>Gagal memuat data.</p>';
        });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const keyword = e.target.value.trim().toLowerCase();
      const filtered = allRows.filter(row => row[0]?.toLowerCase().includes(keyword));
      renderTable(filtered);
    });

    document.getElementById('addGuestForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('newName').value.trim();
      const asal = document.getElementById('newAsal').value.trim();
      const status = document.getElementById('submitStatus');

      if (!name) {
        status.textContent = 'Nama tidak boleh kosong.';
        return;
      }

      fetch(scriptUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `name=${encodeURIComponent(name)}&asal=${encodeURIComponent(asal)}`
      })
      .then(res => res.text())
      .then(text => {
        if (text === "Success") {
          status.textContent = "✅ Tamu berhasil ditambahkan.";
          document.getElementById('newName').value = '';
          document.getElementById('newAsal').value = '';
          fetchData();
        } else {
          status.textContent = "❌ Gagal menambahkan tamu.";
        }
      })
      .catch(err => {
        console.error('Error:', err);
        status.textContent = "❌ Error saat mengirim data.";
      });
    });

    fetchData();
  </script>
</body>
</html>
