<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📋 Digital List Search</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --primary: #0066cc;
      --bg: #f0f4f8;
      --white: #ffffff;
      --gray: #888;
      --border-radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 2rem;
      color: #333;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: var(--white);
      border-radius: var(--border-radius);
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      padding: 1.5rem;
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
      align-items: stretch;
    }

    .dropdown-wrapper {
      flex: 1;
      position: relative;
      min-width: 200px;
    }

    input[list] {
      padding: 0.75rem 2.5rem 0.75rem 1rem;
      font-size: 1rem;
      width: 100%;
      border-radius: var(--border-radius);
      border: 1px solid #ccc;
      transition: border-color 0.2s ease;
    }

    input[list]:focus {
      outline: none;
      border-color: var(--primary);
    }

    .clear-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--gray);
      cursor: pointer;
      padding: 0;
    }

    .clear-btn:hover {
      color: #000;
    }

    #refreshBtn {
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    #refreshBtn:hover {
      background: #004da8;
    }

    #result {
      margin-top: 1rem;
      padding: 1rem;
      background: #fdfdfd;
      border-left: 4px solid var(--primary);
      border-radius: var(--border-radius);
      box-shadow: 0 0 8px rgba(0,0,0,0.05);
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      .input-row {
        flex-direction: column;
      }

      #refreshBtn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📋 Search from List Digital</h2>

    <div class="input-row">
      <div class="dropdown-wrapper">
        <input type="text" id="searchInput" list="dataList" placeholder="Type or choose..." autocomplete="off" />
        <button id="clearBtn" class="clear-btn" title="Clear">×</button>
        <datalist id="dataList"></datalist>
      </div>

      <button id="refreshBtn">🔄 Refresh List</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(fetchData);

    const sheetUrl = 'https://docs.google.com/spreadsheets/d/1QXZWiZX_Muxd4X_XtLUSu5U1gyv3qLox1KOUJeArwxk/gviz/tq?sheet=listdigital&tq=' + encodeURIComponent('SELECT B, C');
    let dataRows = [];

    const input = document.getElementById('searchInput');
    const datalist = document.getElementById('dataList');
    const resultDiv = document.getElementById('result');
    const clearBtn = document.getElementById('clearBtn');
    const refreshBtn = document.getElementById('refreshBtn');

    function fetchData() {
      fetch(sheetUrl)
        .then(res => res.text())
        .then(rep => {
          const json = JSON.parse(rep.substr(47).slice(0, -2));
          const rows = json.table.rows;

          dataRows = rows.map(r => ({
            key: r.c[0]?.v || '',
            value: r.c[1]?.v || ''
          }));

          updateDatalist();
        })
        .catch(err => {
          console.error('Failed to load sheet', err);
          datalist.innerHTML = '';
        });
    }

    function updateDatalist() {
      datalist.innerHTML = '';
      dataRows.forEach(row => {
        const option = document.createElement('option');
        option.value = row.key;
        datalist.appendChild(option);
      });
    }

    function handleSelection(value) {
      const selected = dataRows.find(row => row.key === value);
      if (!selected) {
        resultDiv.innerHTML = `<em>No result found for "<strong>${value}</strong>"</em>`;
        return;
      }

      const url = selected.value;
      const isUrl = url.startsWith("http://") || url.startsWith("https://");

      resultDiv.innerHTML = isUrl
        ? `<strong>Result:</strong><br><a href="${url}" target="_blank">${url}</a>`
        : `<strong>Result:</strong><br>${url}`;
    }

    input.addEventListener('input', (e) => {
      handleSelection(e.target.value);
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      resultDiv.innerHTML = '';
      input.focus();
    });

    refreshBtn.addEventListener('click', () => {
      resultDiv.innerHTML = '';
      input.value = '';
      fetchData();
    });
  </script>
</body>
</html>
