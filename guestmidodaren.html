<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Undangan Midodareni</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fefcf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    h2 {
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      max-width: 400px;
      height: 100px;
      font-size: 1rem;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }

    .buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #388e3c;
    }

    button.clear {
      background-color: #f44336;
    }

    button.clear:hover {
      background-color: #c62828;
    }

    button.copy {
      background-color: #2196F3;
    }

    button.copy:hover {
      background-color: #1565C0;
    }

    .result {
      margin-top: 20px;
      word-break: break-all;
      text-align: center;
    }

    .link-output {
      margin-top: 10px;
      color: #0a58ca;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      textarea {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <h2>🔗 Generator Undangan Midodareni</h2>

  <textarea id="nameInput" placeholder="Ketik nama tamu undangan..."></textarea>

  <div class="buttons">
    <button onclick="generateLink()">Proceed</button>
    <button class="copy" onclick="copyLink()">Copy Link</button>
    <button class="clear" onclick="clearAll()">Clear</button>
  </div>

  <div class="result" id="resultBox" style="display:none;">
    <p>Berikut link undangan personal:</p>
    <div class="link-output" id="linkOutput"></div>
  </div>

  <script>
    function generateLink() {
      const name = document.getElementById("nameInput").value.trim();
      if (!name) {
        alert("Silakan masukkan nama tamu terlebih dahulu.");
        return;
      }

      const encodedName = encodeURIComponent(name);
      const url = `https://gasnikahkuy.github.io/isabella-kristiyanto/midodaren.html?to=${encodedName}`;

      document.getElementById("linkOutput").innerHTML = `<a href="${url}" target="_blank" id="finalLink">${url}</a>`;
      document.getElementById("resultBox").style.display = "block";
    }

    function copyLink() {
      const linkEl = document.getElementById("finalLink");
      if (!linkEl) {
        alert("Belum ada link untuk disalin.");
        return;
      }

      const tempInput = document.createElement("input");
      tempInput.value = linkEl.href;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand("copy");
      document.body.removeChild(tempInput);

      alert("Link berhasil disalin ke clipboard!");
    }

    function clearAll() {
      document.getElementById("nameInput").value = "";
      document.getElementById("linkOutput").innerHTML = "";
      document.getElementById("resultBox").style.display = "none";
    }
  </script>

</body>
</html>
