<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📋 Daftar Tamu Unduh Mantu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f7f9fb;
      padding: 2rem;
      margin: 0;
      color: #333;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background-color: #993333;
      color: white;
    }

    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      td:before {
        content: attr(data-label);
        font-weight: bold;
        display: block;
        margin-bottom: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <h2>📋 Daftar Tamu Unduh Mantu</h2>

  <div style="max-width: 500px; margin: 0 auto 1rem;">
    <input
      type="text"
      id="searchInput"
      placeholder="🔍 Cari nama tamu..."
    />
  </div>

  <div id="tableContainer">Loading...</div>

  <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/1D0KY0MwZQk2jk9J8VFUvrvYHLpEkuLYG7uyD2J3PF2Q/gviz/tq?sheet=Sheet1&tq=' + encodeURIComponent('SELECT B, C');

    let allRows = [];

    function renderTable(rows) {
      const container = document.getElementById('tableContainer');
      if (!rows.length) {
        container.innerHTML = '<p>Tidak ada data yang cocok.</p>';
        return;
      }

      let html = '<table><thead><tr><th>Nama</th><th>Asal</th></tr></thead><tbody>';
      rows.forEach(row => {
        const name = row[0] || '';
        const asal = row[1] || '';

        html += `<tr>
          <td data-label="Nama">${name}</td>
          <td data-label="Asal">${asal}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function fetchData() {
      fetch(sheetUrl)
        .then(res => res.text())
        .then(rep => {
          const json = JSON.parse(rep.substr(47).slice(0, -2));
          allRows = json.table.rows.map(r => [
            r.c[0]?.v || '',
            r.c[1]?.v || ''
          ]);
          renderTable(allRows);
        })
        .catch(err => {
          console.error('Gagal memuat data', err);
          document.getElementById('tableContainer').innerHTML = '<p>Gagal memuat data.</p>';
        });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const keyword = e.target.value.trim().toLowerCase();
      const filtered = allRows.filter(row => row[0]?.toLowerCase().includes(keyword));
      renderTable(filtered);
    });

    fetchData();
  </script>
</body>
</html>
