<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📋 Wedding Guest List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f7f9fb;
      padding: 2rem;
      margin: 0;
      color: #333;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background-color: #0066cc;
      color: white;
    }

    a {
      color: #0066cc;
      text-decoration: none;
    }

    button {
      background: #25D366;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1ebe5d;
    }

    @media (max-width: 600px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      th {
        position: sticky;
        top: 0;
      }

      td {
        padding: 0.75rem;
        border-bottom: 1px solid #ddd;
      }

      td:before {
        content: attr(data-label);
        font-weight: bold;
        display: block;
        margin-bottom: 0.5rem;
      }

      button {
        width: 100%;
        margin-top: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <h2>📋 Wedding Guest List</h2>

  <div style="max-width: 500px; margin: 0 auto 1rem;">
    <input
      type="text"
      id="searchInput"
      placeholder="🔍 Search by name..."
    />
  </div>

  <div id="tableContainer">Loading...</div>

  <script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/1QXZWiZX_Muxd4X_XtLUSu5U1gyv3qLox1KOUJeArwxk/gviz/tq?sheet=listdigital&tq=' + encodeURIComponent('SELECT B, C, D, E');
    let allRows = [];

    function normalizePhoneNumber(number) {
      if (!number) return '';
      number = String(number).replace(/\D/g, '');

      if (number.startsWith('0')) {
        return '62' + number.slice(1);
      } else if (number.startsWith('62')) {
        return number;
      } else if (number.startsWith('8')) {
        return '62' + number;
      }
      return number;
    }

    function createWhatsAppLink(name, link, rawNumber) {
      const phone = normalizePhoneNumber(rawNumber);
      const safeLink = encodeURI(link);
      const message = `Yth. Bapak/Ibu/Saudara/i
${name}

Salam damai dan sukacita,

Dengan penuh syukur, kami percaya bahwa Tuhan senantiasa menyempurnakan segala sesuatu pada waktu-Nya. Dalam kasih-Nya, kami dipersatukan dalam ikatan pernikahan suci. Kiranya berkat dan penyertaan Tuhan senantiasa menaungi perjalanan hidup kami ke depan.

Dengan segala hormat dan kerendahan hati, kami mengundang Bapak/Ibu/Saudara/i, sebagai sahabat dan bagian berharga dalam hidup kami, untuk hadir dan menyaksikan hari bahagia kami.

Informasi lengkap mengenai acara pernikahan kami dapat diakses melalui tautan berikut:
${safeLink}

Merupakan sukacita tersendiri bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan turut mendoakan kelangsungan pernikahan kami.

Terima kasih atas perhatian dan doa restunya.

Hormat kami,
Bella dan Kris`;

      const encodedMsg = encodeURIComponent(message);
      return `https://wa.me/${phone}?text=${encodedMsg}`;
    }

    function renderTable(rows) {
      const container = document.getElementById('tableContainer');
      if (!rows.length) {
        container.innerHTML = '<p>No matching data.</p>';
        return;
      }

      let html = '<table><thead><tr><th>Name</th><th>Link</th><th>Asal</th><th>WhatsApp</th></tr></thead><tbody>';
      rows.forEach(row => {
        const name = row[0] || '';
        const link = row[1] || '';
        const phone = row[2] || '';
        const asal = row[3] || '';
        const waLink = createWhatsAppLink(name, link, phone);

        html += `<tr>
          <td data-label="Name">${name}</td>
          <td data-label="Link"><a href="${link}" target="_blank">View Link</a></td>
          <td data-label="Asal">${asal}</td>
          <td data-label="WhatsApp">
            <a href="${waLink}" target="_blank">
              <button>Send to WhatsApp</button>
            </a>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function fetchData() {
      fetch(sheetUrl)
        .then(res => res.text())
        .then(rep => {
          const json = JSON.parse(rep.substr(47).slice(0, -2));
          allRows = json.table.rows.map(r => [
            r.c[0]?.v || '',
            r.c[1]?.v || '',
            r.c[2]?.v || '',
            r.c[3]?.v || ''
          ]);
          renderTable(allRows);
        })
        .catch(err => {
          console.error('Failed to load data', err);
          document.getElementById('tableContainer').innerHTML = '<p>Error loading data.</p>';
        });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const keyword = e.target.value.trim().toLowerCase();
      const filtered = allRows.filter(row => row[0]?.toLowerCase().includes(keyword));
      renderTable(filtered);
    });

    fetchData();
  </script>
</body>
</html>
