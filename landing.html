<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-scroll {
      animation: scroll 90s linear infinite;
    }
  </style>
</head>
<body class="bg-white text-gray-800">

  <!-- Header with Navigation Buttons -->
  <header class="w-full px-4 py-6 flex flex-col sm:flex-row items-center justify-center sm:justify-between gap-4 bg-white shadow-md">
    <h1 class="text-2xl font-bold text-center sm:text-left">💒 Wedding Hub</h1>
    <nav class="flex flex-wrap gap-3 justify-center">
      <a href="index.html" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Index</a>
      <a href="guestlink.html" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">Guest Link</a>
      <a href="midodaren.html" class="px-4 py-2 bg-yellow-600 text-white rounded hover:bg-yellow-700 transition">Midodareni</a>
      <a href="guestmidodaren.html" class="px-4 py-2 bg-amber-600 text-white rounded hover:bg-amber-700 transition">Guest Midodareni</a>
      <a href="unduhmantu.html" class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700 transition">Unduh Mantu</a>
      <a href="guestunduhmantu.html" class="px-4 py-2 bg-pink-600 text-white rounded hover:bg-pink-700 transition">Guest Unduh Mantu</a>
    </nav>
  </header>

  <!-- Main Gallery Section -->
  <main class="w-full min-h-screen bg-white flex flex-col items-center justify-center px-4 overflow-hidden relative py-10">
    <h2 class="text-3xl sm:text-4xl font-bold text-center mb-8">Our Gallery</h2>
    <div class="relative w-full overflow-hidden">
      <div class="flex animate-scroll w-max">
        <!-- Looping Gallery Images -->
        <!-- TIP: If needed, generate image tags with JS or backend in future -->
        <!-- You can remove duplicate images if you're optimizing load -->
        ${[...Array(2)].map(() => `
          ${[...Array(15)].map((_, i) => `
            <img src="assets/gal${i + 1}.png" alt="Gallery ${i + 1}" class="w-64 sm:w-72 flex-shrink-0 rounded-xl mx-2" />
          `).join('')}
        `).join('')}
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 text-sm text-gray-400">
    &copy; 2025 Kristiyanto & Isabella Wedding
  </footer>

</body>
</html>
