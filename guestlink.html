<!DOCTYPE html>

<html>

<head>

 <meta charset="UTF-8">

 <title>List Digital Dropdown</title>

 <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

 <style>

  body {

   font-family: Arial, sans-serif;

   padding: 2rem;

   background: #f5f5f5;

  }

  h2 {

   margin-bottom: 1rem;

  }

  select {

   padding: 0.5rem;

   font-size: 1rem;

  }

  #result {

   margin-top: 1rem;

   padding: 1rem;

   background: white;

   border-radius: 6px;

   box-shadow: 0 0 10px rgba(0,0,0,0.1);

  }

  a {

   color: #0066cc;

   text-decoration: none;

   font-weight: bold;

  }

  a:hover {

   text-decoration: underline;

  }

 </style>

</head>

<body>

 <h2>Select from List Digital</h2>

 <select id="dropdown">

  <option value="">Loading...</option>

 </select>

 <div id="result"></div>



 <script>

  google.charts.load('current', { packages: ['corechart'] });

  google.charts.setOnLoadCallback(init);



  const sheetUrl = 'https://docs.google.com/spreadsheets/d/1QXZWiZX_Muxd4X_XtLUSu5U1gyv3qLox1KOUJeArwxk/gviz/tq?sheet=listdigital&tq=' + encodeURIComponent('SELECT B, C');



  let dataRows = [];



  function init() {

   fetch(sheetUrl)

    .then(res => res.text())

    .then(rep => {

     const json = JSON.parse(rep.substr(47).slice(0, -2));

     const rows = json.table.rows;



     const dropdown = document.getElementById('dropdown');

     dropdown.innerHTML = '<option value="">-- Select an option --</option>';



     dataRows = rows.map(r => ({

      key: r.c[0]?.v || '',

      value: r.c[1]?.v || ''

     }));



     dataRows.forEach((row, i) => {

      const option = document.createElement('option');

      option.value = i; // index

      option.textContent = row.key;

      dropdown.appendChild(option);

     });



     dropdown.addEventListener('change', e => {

      const idx = e.target.value;

      const resultDiv = document.getElementById('result');

      if (idx === '') {

       resultDiv.innerHTML = '';

       return;

      }

      const selected = dataRows[idx];

      const url = selected.value;



      // Simple check if it's a URL, otherwise just print plain text

      const isUrl = url.startsWith("http://") || url.startsWith("https://");



      resultDiv.innerHTML = isUrl

       ? `<strong>Result:</strong><br><a href="${url}" target="_blank">${url}</a>`

       : `<strong>Result:</strong><br>${url}`;

     });

    })

    .catch(err => {

     console.error('Failed to load sheet', err);

     document.getElementById('dropdown').innerHTML = '<option>Error loading data</option>';

    });

  }

 </script>

</body>

</html>
